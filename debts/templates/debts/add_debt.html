<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Borrowed Money</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #111827;
            padding: 40px;
        }

        .card {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-control {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        .errorlist {
            color: #dc2626;
            list-style: none;
            padding: 0;
            margin-bottom: 5px;
        }

        button,
        a {
            padding: 11px 18px;
            border-radius: 6px;
            border: none;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #2563eb;
            color: white;
        }

        a {
            background: #e5e7eb;
            color: #111827;
            margin-left: 8px;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>
        Add Borrowed Money
    </h1>

    <p class="subtitle">
        Record money you have borrowed.
    </p>


    <form method="POST">

        {% csrf_token %}


        {% for field in form %}

            <div class="form-group">

                {{ field.errors }}

                <label>
                    {{ field.label }}
                </label>

                {{ field }}

            </div>

        {% endfor %}


        <button type="submit">
            Save Borrowed
        </button>

        <a href="/debts/">
            Cancel
        </a>

    </form>

</div>

</body>

</html>
